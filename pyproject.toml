[project]
name = "wasabi"
version = "0.1.0"
description = "Weighted Adaptive Stimulation After Batch-testing Identification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13",
    "jax>=0.11",
    "numpy",
    "optax>=0.2.8",
    "tqdm",
]

[project.optional-dependencies]
# GPU build of jaxlib. Install with: uv sync --extra cuda
cuda = ["jax[cuda12]>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasabi"]

[tool.uv.sources]
simulations = { workspace = true }

[tool.uv.workspace]
members = ["simulations"]

[dependency-groups]
dev = [
    "simulations",
    "ipykernel>=7.3.0",
    "matplotlib",
    "nbformat>=5.11.1",
    "plotly>=7.0.0",
    "pytest>=8",
    "scikit-learn>=1.7.2",
]

[tool.ruff.lint]
# keep unused imports on auto-fix; still reported as F401
unfixable = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
