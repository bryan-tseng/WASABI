[project]
name = "simulations"
version = "0.1.0"
description = "Ground-truth Poisson LDS simulations for WASABI"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulations"]
